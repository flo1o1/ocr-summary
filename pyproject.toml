[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-summary"
version = "0.5.0"
description = "Local Apple OCR summaries and keywords for PDFs and images"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing",
]

[project.scripts]
ocr-summary = "ocr_summary:main"

[tool.setuptools]
py-modules = ["ocr_summary"]
