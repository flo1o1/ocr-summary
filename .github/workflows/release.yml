name: Release binary

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check tag matches pyproject version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build binary
        # pyproject.toml is bundled so --version works outside a pip install.
        run: |
          python -m pip install pyinstaller
          pyinstaller --onefile --name ocr-summary \
            --add-data "pyproject.toml:." ocr-summary
          dist/ocr-summary --version
      - name: Package
        run: |
          name="ocr-summary-${GITHUB_REF_NAME}-macos-arm64"
          tar -czf "$name.tar.gz" -C dist ocr-summary
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes ocr-summary-*.tar.gz*
